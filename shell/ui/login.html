<!doctype html>
<html lang="en" data-theme="__HOMEOS_THEME__" data-bg="__HOMEOS_BG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="homeos-state" content="__HOMEOS_STATE__">
<title>Sign in - HomeOS</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body class="spacey">
<canvas id="space" aria-hidden="true"></canvas>
<header class="status">
  <div class="brand"><svg class="mark" viewBox="0 -960 960 960" aria-hidden="true"><path d="M220-180h150v-220q0-12.75 8.63-21.38Q387.25-430 400-430h160q12.75 0 21.38 8.62Q590-412.75 590-400v220h150v-390L480-765 220-570v390Zm-60 0v-390q0-14.25 6.38-27 6.37-12.75 17.62-21l260-195q15.68-12 35.84-12Q500-825 516-813l260 195q11.25 8.25 17.63 21 6.37 12.75 6.37 27v390q0 24.75-17.62 42.37Q764.75-120 740-120H560q-12.75 0-21.37-8.63Q530-137.25 530-150v-220H430v220q0 12.75-8.62 21.37Q412.75-120 400-120H220q-24.75 0-42.37-17.63Q160-155.25 160-180Zm320-293Z"/></svg>HomeOS</div>
</header>
<main class="start">
  <section class="hero">
    <div class="when">
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <article class="widget" id="w-weather" hidden>
      <div class="w-head"><span class="w-icon" id="w-weather-icon"></span><span class="w-big" id="w-weather-temp"></span></div>
      <p class="w-line" id="w-weather-text"></p>
      <p class="w-sub" id="w-weather-sub"></p>
      <div class="w-days" id="w-weather-days"></div>
    </article>
  </section>
  <form class="signin" id="login-form">
    <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Web access password" required>
    <button type="submit" id="go" aria-label="Sign in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
  </form>
  <p class="signin-error" id="error" role="alert"></p>
  <div class="login" id="nopass" hidden>
    <p class="sub">No password has been set yet, so web access is locked. On the Pi, run:</p>
    <code>homeos-web --set-password</code>
  </div>
</main>
<script src="space.js"></script>
<script src="login.js"></script>
</body>
</html>
